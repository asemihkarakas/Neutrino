<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#060B18"/>
      <stop offset="100%" stop-color="#0C1A2E"/>
    </linearGradient>

    <!-- Dot grid -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.9" fill="#1A3352" opacity="0.55"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="glow-sm" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Stream gradients -->
    <linearGradient id="sg-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#00D4FF" stop-opacity="0.85"/>
      <stop offset="88%"  stop-color="#00D4FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sg-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#818CF8" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#818CF8" stop-opacity="0.7"/>
      <stop offset="80%"  stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sg-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#34D399" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#34D399" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sg-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sg-cyan-faint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00D4FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Right panel separator gradient -->
    <linearGradient id="sep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1E3A5F" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#1E3A5F" stop-opacity="0.7"/>
      <stop offset="70%"  stop-color="#1E3A5F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- ── BACKGROUND ──────────────────────────────────────────────── -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>

  <!-- ── PARTICLE STREAMS ───────────────────────────────────────── -->

  <!-- Stream A  cyan  y=38 -->
  <line x1="0" y1="38" x2="1200" y2="38" stroke="url(#sg-cyan)" stroke-width="1.5" filter="url(#glow-sm)"/>
  <circle cy="38" r="4" fill="#00D4FF" filter="url(#glow-sm)">
    <animate attributeName="cx" from="-30" to="1230" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cy="38" r="2.5" fill="#00D4FF">
    <animate attributeName="cx" from="-30" to="1230" dur="3.8s" begin="1.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.06;0.92;1" dur="3.8s" begin="1.9s" repeatCount="indefinite"/>
  </circle>

  <!-- Stream B  indigo  y=108 (faint — behind title area) -->
  <line x1="0" y1="108" x2="1200" y2="108" stroke="url(#sg-indigo)" stroke-width="1" opacity="0.45"/>
  <circle cy="108" r="2" fill="#818CF8" opacity="0.7" filter="url(#glow-sm)">
    <animate attributeName="cx" from="-30" to="1230" dur="5.2s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.06;0.92;1" dur="5.2s" begin="1.1s" repeatCount="indefinite"/>
  </circle>

  <!-- Stream C  cyan faint  y=220 (through badge row) -->
  <line x1="0" y1="220" x2="1200" y2="220" stroke="url(#sg-cyan-faint)" stroke-width="1"/>

  <!-- Stream D  green  y=295 -->
  <line x1="0" y1="295" x2="1200" y2="295" stroke="url(#sg-green)" stroke-width="1.5" filter="url(#glow-sm)"/>
  <circle cy="295" r="3.5" fill="#34D399" filter="url(#glow-sm)">
    <animate attributeName="cx" from="-30" to="1230" dur="4.4s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="4.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cy="295" r="2" fill="#34D399">
    <animate attributeName="cx" from="-30" to="1230" dur="4.4s" begin="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.06;0.92;1" dur="4.4s" begin="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Stream E  amber  y=368 -->
  <line x1="0" y1="368" x2="1200" y2="368" stroke="url(#sg-amber)" stroke-width="1"/>
  <circle cy="368" r="2.5" fill="#FBBF24">
    <animate attributeName="cx" from="-30" to="1230" dur="6.1s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.06;0.92;1" dur="6.1s" begin="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- ── LEFT CONTENT ───────────────────────────────────────────── -->

  <!-- Title glow layer -->
  <text x="80" y="196"
        font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="88" font-weight="900" letter-spacing="-3"
        fill="#00D4FF" opacity="0.08"
        filter="url(#glow-lg)">NEUTRINO</text>

  <!-- Title -->
  <text x="80" y="196"
        font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="88" font-weight="900" letter-spacing="-3"
        fill="#F0F6FC">NEUTRINO</text>

  <!-- Accent underline -->
  <rect x="80" y="208" width="490" height="2" rx="1" fill="url(#sg-cyan)" opacity="0.9"/>

  <!-- Subtitle -->
  <text x="82" y="234"
        font-family="'Courier New', Courier, monospace"
        font-size="13.5" letter-spacing="1.8" fill="#475569">
    ZERO-LATENCY QoS TELEMETRY INGESTION ENGINE
  </text>

  <!-- Badges row -->
  <!-- C++20 -->
  <rect x="82"  y="252" width="64"  height="25" rx="12" fill="none" stroke="#00D4FF" stroke-width="1"/>
  <text x="114" y="269" font-family="'Courier New',monospace" font-size="11.5" fill="#00D4FF" text-anchor="middle" font-weight="bold">C++20</text>

  <!-- Lock-Free -->
  <rect x="154" y="252" width="78"  height="25" rx="12" fill="none" stroke="#818CF8" stroke-width="1"/>
  <text x="193" y="269" font-family="'Courier New',monospace" font-size="11.5" fill="#818CF8" text-anchor="middle" font-weight="bold">Lock-Free</text>

  <!-- <10µs -->
  <rect x="240" y="252" width="76"  height="25" rx="12" fill="none" stroke="#34D399" stroke-width="1"/>
  <text x="278" y="269" font-family="'Courier New',monospace" font-size="11.5" fill="#34D399" text-anchor="middle" font-weight="bold">&lt;10µs</text>

  <!-- Zero-Copy -->
  <rect x="324" y="252" width="88"  height="25" rx="12" fill="none" stroke="#FBBF24" stroke-width="1"/>
  <text x="368" y="269" font-family="'Courier New',monospace" font-size="11.5" fill="#FBBF24" text-anchor="middle" font-weight="bold">Zero-Copy</text>

  <!-- MIT -->
  <rect x="420" y="252" width="54"  height="25" rx="12" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="447" y="269" font-family="'Courier New',monospace" font-size="11.5" fill="#334155" text-anchor="middle">MIT</text>

  <!-- Bottom tagline -->
  <text x="82" y="320"
        font-family="'Courier New', Courier, monospace"
        font-size="12.5" fill="#1E3A5F" letter-spacing="0.3">
    No heap · No mutex · No exceptions · No jitter
  </text>

  <!-- ── SEPARATOR ───────────────────────────────────────────────── -->
  <line x1="648" y1="0" x2="648" y2="400" stroke="url(#sep)" stroke-width="1"/>

  <!-- ── RIGHT CONTENT: PIPELINE DIAGRAM ──────────────────────────── -->

  <!-- Section label -->
  <text x="912" y="108"
        font-family="'Courier New',monospace" font-size="10"
        fill="#1E3A5F" text-anchor="middle" letter-spacing="3">DATA PATH</text>

  <!-- ┌──────────┐ -->
  <!-- │ UDP RECV │ -->
  <!-- └──────────┘ -->
  <rect x="672" y="148" width="124" height="72" rx="8"
        fill="#070D1C" stroke="#00D4FF" stroke-width="1.5"/>
  <text x="734" y="174" font-family="'Courier New',monospace" font-size="11"   fill="#64748B"  text-anchor="middle">UDP RECV</text>
  <text x="734" y="191" font-family="'Courier New',monospace" font-size="10.5" fill="#00D4FF"  text-anchor="middle">recvfrom()</text>
  <text x="734" y="208" font-family="'Courier New',monospace" font-size="9"    fill="#1E3A5F"  text-anchor="middle">PacketPool ×1024</text>

  <!-- arrow → -->
  <line x1="796" y1="184" x2="822" y2="184" stroke="#00D4FF" stroke-width="1.5" opacity="0.75"/>
  <polygon points="820,179 830,184 820,189" fill="#00D4FF" opacity="0.75"/>

  <!-- ┌────────────┐ -->
  <!-- │ SPSC QUEUE │ -->
  <!-- └────────────┘ -->
  <rect x="830" y="148" width="124" height="72" rx="8"
        fill="#070D1C" stroke="#818CF8" stroke-width="1.5"/>
  <text x="892" y="174" font-family="'Courier New',monospace" font-size="11"   fill="#64748B"  text-anchor="middle">SPSC QUEUE</text>
  <text x="892" y="191" font-family="'Courier New',monospace" font-size="10.5" fill="#818CF8"  text-anchor="middle">wait-free</text>
  <text x="892" y="208" font-family="'Courier New',monospace" font-size="9"    fill="#1E3A5F"  text-anchor="middle">4096 slots</text>

  <!-- arrow → -->
  <line x1="954" y1="184" x2="980" y2="184" stroke="#818CF8" stroke-width="1.5" opacity="0.75"/>
  <polygon points="978,179 988,184 978,189" fill="#818CF8" opacity="0.75"/>

  <!-- ┌─────────┐ -->
  <!-- │ PROCESS │ -->
  <!-- └─────────┘ -->
  <rect x="988" y="148" width="124" height="72" rx="8"
        fill="#070D1C" stroke="#34D399" stroke-width="1.5"/>
  <text x="1050" y="174" font-family="'Courier New',monospace" font-size="11"   fill="#64748B"  text-anchor="middle">PROCESS</text>
  <text x="1050" y="191" font-family="'Courier New',monospace" font-size="10.5" fill="#34D399"  text-anchor="middle">QoS classify</text>
  <text x="1050" y="208" font-family="'Courier New',monospace" font-size="9"    fill="#1E3A5F"  text-anchor="middle">atomic stats</text>

  <!-- ↓ dashed output arrow -->
  <line x1="1050" y1="220" x2="1050" y2="256" stroke="#34D399" stroke-width="1"
        stroke-dasharray="3,3" opacity="0.55"/>
  <polygon points="1045,254 1050,264 1055,254" fill="#34D399" opacity="0.55"/>

  <!-- FlowStats box -->
  <rect x="988" y="264" width="124" height="34" rx="6"
        fill="#070D1C" stroke="#1E3A5F" stroke-width="1"/>
  <text x="1050" y="286" font-family="'Courier New',monospace" font-size="10"
        fill="#334155" text-anchor="middle">FlowStats[ ] ×1024</text>

  <!-- Latency badge under pipeline -->
  <text x="850" y="256" font-family="'Courier New',monospace" font-size="10"
        fill="#1E3A5F" text-anchor="middle">avg 8 – 10 µs end-to-end</text>

</svg>
